name: Build Electron App

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write   # ត្រូវការសិទ្ធិនេះដើម្បីបង្កើត Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Electron (.exe)
        run: npm run dist

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: HP-Check-Me-Installer
          path: dist/*.exe

      # ដំណើរការតែពេល push ជា tag ដូចជា v1.0.1 ប៉ុណ្ណោះ
      - name: Create GitHub Release with installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          name: Release ${{ github.ref_name }}
          body: |
            ## HP Check Me ${{ github.ref_name }}

            ទាញយក installer ខាងក្រោម (`HPCheckMe-Setup-*.exe`) ហើយ run លើ Windows។
            *កម្មវិធីដែលដំឡើងរួចហើយ នឹង update ដោយស្វ័យប្រវត្តិ។*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
